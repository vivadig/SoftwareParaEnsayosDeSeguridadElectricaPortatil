; Firmware del ESP32 del banco de ensayo: lectura de módulos PZEM-004T v3/v4.
;
; Compilar y cargar (con PlatformIO instalado):
;   pio run -d firmware/esp32_pzem -t upload
; Monitor serie:
;   pio device monitor -b 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    mandulaj/PZEM-004T-v30@^1.1.2
