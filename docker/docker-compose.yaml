services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ensayos-seguridad-dev
    user: "0"
    command: shell
    ports:
      - "5000:5000"
      - "8000:8000"
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../pyproject.toml:/app/pyproject.toml
      - ../pytest.ini:/app/pytest.ini
      - /dev:/dev
    # devices:
    #   - /dev/hidraw5:/dev/hidraw5
    # device_cgroup_rules:
    #   - "c 241:* rmw"
    environment:
      - PYTHONPATH=/app
      - ENV=development
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
