[project]
name = "ensayos-seguridad-electrica"
version = "0.1.0"
description = "Software para ensayos de seguridad eléctrica portátil"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "hidapi>=0.14",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=6.0,<7",
    "coverage[toml]>=7.5,<8",
    "ruff>=0.11,<1",
    "pre-commit>=4.2,<5",
]
gui = [
    "PyQt5>=5.15",
    # PyQt5-Qt5 > 5.15.2 no publica instaladores para Windows
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
    "PyQt5-Qt5>=5.15.18; sys_platform != 'win32'",
    "pyqtgraph>=0.13",
    "pglive>=0.7",
]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
export = ["openpyxl>=3.1"]
auth = ["bcrypt>=4.0"]
all = [
    "ensayos-seguridad-electrica[dev,gui,api,export,auth]",
]

[project.scripts]
ensayos-gui = "ensayos.gui.main:main"
ensayos-api = "ensayos.api.app:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
# Exclude common directories
exclude = [
    "*.pyi",
    "__pycache__",
    "__init__.py",
    ".pytest_cache",
    ".venv",
    "venv",
    "build",
    "dist",
]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable recommended rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
fixable = ["ALL"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Format code like Black
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]